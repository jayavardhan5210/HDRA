<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Risk Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f5;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            margin-bottom: 30px;
        }

        h2 {
            color: #d32f2f;
            border-bottom: 2px solid #ffd0d0;
            padding-bottom: 10px;
            margin-top: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #d32f2f;
        }

        .upload-box {
            margin-top: 20px;
            border: 2px dashed #ef5350;
            padding: 22px;
            border-radius: 12px;
            background: #fffafa;
        }

        .upload-box label {
            color: #c62828;
            font-size: 18px;
        }

        .upload-info {
            color: #777;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        #ecgPreview {
            display: none;
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 15px 45px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b71c1c;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

        .loading {
            color: #e65100;
        }

        .disclaimer {
            margin-top: 35px;
            padding: 18px;
            background: #fff0f0;
            border-left: 5px solid #d32f2f;
            border-radius: 5px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #d32f2f;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }

            .container {
                width: 95%;
                padding: 20px;
            }
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>❤️ Heart-health Risk Assessment</h1>


        <form id="assessmentForm" enctype="multipart/form-data">


            <h2>Patient Information</h2>


            <div class="form-grid">


                <div class="form-group full">

                    <label>
                        Full Name
                    </label>

                    <input type="text" name="full_name" placeholder="Enter patient name" required>

                </div>


                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input type="number" name="age" min="1" max="120" required>

                </div>


                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <select name="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="0">
                            Female
                        </option>

                        <option value="1">
                            Male
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Blood Pressure
                    </label>

                    <input type="number" name="bp" placeholder="e.g. 120" required>

                </div>


                <div class="form-group">

                    <label>
                        Cholesterol
                    </label>

                    <input type="number" name="cholesterol" placeholder="mg/dL" required>

                </div>


                <div class="form-group">

                    <label>
                        BMI
                    </label>

                    <input type="number" name="bmi" step="0.1" placeholder="e.g. 24.5" required>

                </div>


                <div class="form-group">

                    <label>
                        Diabetes
                    </label>

                    <select name="diabetes" required>

                        <option value="0">
                            No
                        </option>

                        <option value="1">
                            Yes
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Smoking
                    </label>

                    <select name="smoking" required>

                        <option value="0">
                            No
                        </option>

                        <option value="1">
                            Yes
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Family History of Heart Disease
                    </label>

                    <select name="family_history" required>

                        <option value="0">
                            No
                        </option>

                        <option value="1">
                            Yes
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Exercise Level
                    </label>

                    <select name="exercise" required>

                        <option value="0">
                            Low
                        </option>

                        <option value="1">
                            Moderate
                        </option>

                        <option value="2">
                            High
                        </option>

                    </select>

                </div>


            </div>


            <h2>ECG Analysis</h2>


            <div class="upload-box">

                <label>
                    Upload ECG Image
                    (JPG / JPEG / PNG)
                </label>


                <input type="file" id="ecg" name="ecg" accept=".jpg,.jpeg,.png,image/jpeg,image/png" required>


                <div class="upload-info">

                    Upload a clear 12-lead ECG image.

                </div>


                <img id="ecgPreview" alt="ECG Preview">

            </div>


            <div class="button-container">

                <button type="submit" id="submitButton">
                    Assess My Heart Risk
                </button>

            </div>


            <div id="message"></div>


        </form>


        <div class="disclaimer">

            <strong>Disclaimer:</strong>

            This AI system is intended for educational
            and research purposes only. It is not a
            medical diagnosis or a replacement for
            professional medical advice.

        </div>


        <a href="/" class="back">
            ← Back to Home
        </a>


    </div>


    <script>

        const form =
            document.getElementById(
                "assessmentForm"
            );


        const ecgInput =
            document.getElementById(
                "ecg"
            );


        const preview =
            document.getElementById(
                "ecgPreview"
            );


        const message =
            document.getElementById(
                "message"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );



        /* ECG IMAGE PREVIEW */

        ecgInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    preview.style.display =
                        "none";

                    preview.removeAttribute(
                        "src"
                    );

                    return;
                }


                const allowedTypes = [
                    "image/jpeg",
                    "image/png"
                ];


                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    message.className =
                        "error";

                    message.innerText =
                        "Please upload a JPG, JPEG or PNG image.";

                    this.value = "";

                    preview.style.display =
                        "none";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        preview.src =
                            event.target.result;

                        preview.style.display =
                            "block";

                        message.className =
                            "success";

                        message.innerText =
                            "ECG image selected successfully.";

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );



        /* FORM SUBMISSION */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const file =
                    ecgInput.files[0];


                if (!file) {

                    message.className =
                        "error";

                    message.innerText =
                        "Please upload an ECG image.";

                    return;
                }


                const formData =
                    new FormData(form);


                submitButton.disabled =
                    true;


                submitButton.innerText =
                    "Analyzing ECG...";


                message.className =
                    "loading";

                message.innerText =
                    "Uploading ECG and running AI analysis. Please wait...";


                try {

                    const response =
                        await fetch(
                            "/predict",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Prediction failed."
                        );

                    }


                    if (
                        data.status !==
                        "success"
                    ) {

                        throw new Error(
                            data.message ||
                            "Prediction failed."
                        );

                    }


                    sessionStorage.setItem(
                        "assessmentResult",
                        JSON.stringify(data)
                    );


                    sessionStorage.setItem(
                        "patientName",
                        data.patient_name ||
                        "Patient"
                    );


                    message.className =
                        "success";

                    message.innerText =
                        "Analysis completed. Opening result...";


                    setTimeout(
                        function () {

                            window.location.href =
                                "/result.html";

                        },
                        500
                    );


                }

                catch (error) {

                    console.error(
                        "Prediction error:",
                        error
                    );


                    message.className =
                        "error";


                    message.innerText =
                        error.message ||
                        "Unable to connect to the server. Please check Flask.";


                    submitButton.disabled =
                        false;


                    submitButton.innerText =
                        "Assess My Heart Risk";

                }

            }
        );

    </script>


</body>

</html>
